{% extends "base.html" %}
{% block content %}
<h1>Customers</h1>
<form method="get"><input name="q" value="{{ q }}" placeholder="Search name/phone"><button class="btn">Search</button></form>
<p><a class="btn" href="{% url 'customer_create' %}">+ Add Customer</a></p>
<div class="card"><table><tr><th>Name</th><th>Phone</th><th>Email</th><th>Actions</th></tr>
{% for c in customers %}<tr><td>{{ c.name }}</td><td>{{ c.phone }}</td><td>{{ c.email }}</td><td>
<a href="{% url 'customer_update' c.id %}">Edit</a> | <a href="{% url 'customer_delete' c.id %}">Delete</a></td></tr>
{% empty %}<tr><td colspan="4">No customers.</td></tr>{% endfor %}
</table></div>
{% endblock %}
