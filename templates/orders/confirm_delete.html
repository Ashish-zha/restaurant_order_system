{% extends "base.html" %}
{% block content %}
<div class="card">
<h2>Delete {{ object }}?</h2>
<p>This action cannot be undone.</p>
<form method="post">{% csrf_token %}
<button class="btn btn-danger">Yes, Delete</button>
<a class="btn btn-light" href="{% url back_url %}">Cancel</a>
</form>
</div>
{% endblock %}
