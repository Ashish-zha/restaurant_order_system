{% extends "base.html" %}
{% block content %}
<h1>Categories</h1>
<a class="btn" href="{% url 'category_create' %}">+ Add Category</a>
<div class="card"><table><tr><th>Name</th><th>Description</th><th>Actions</th></tr>
{% for c in categories %}<tr><td>{{ c.name }}</td><td>{{ c.description }}</td><td>
<a href="{% url 'category_update' c.id %}">Edit</a> |
<a href="{% url 'category_delete' c.id %}">Delete</a></td></tr>
{% empty %}<tr><td colspan="3">No categories.</td></tr>{% endfor %}
</table></div>
{% endblock %}
