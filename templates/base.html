<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Restaurant Order System{% endblock %}</title>
    <style>
        body{font-family:Arial,sans-serif;margin:0;background:#f5f6f8;color:#222}
        nav{background:#222;color:#fff;padding:14px 24px;display:flex;gap:18px;flex-wrap:wrap}
        nav a{color:#fff;text-decoration:none}
        .container{max-width:1100px;margin:25px auto;padding:0 18px}
        .card{background:#fff;border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px #0001}
        table{width:100%;border-collapse:collapse;background:#fff}
        th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}
        .btn{display:inline-block;padding:9px 14px;border:0;border-radius:6px;background:#222;color:#fff;text-decoration:none;cursor:pointer}
        .btn-danger{background:#b42318}.btn-light{background:#eee;color:#222}
        input,select,textarea{width:100%;padding:9px;margin:6px 0 14px;box-sizing:border-box}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
        .stat{font-size:28px;font-weight:bold}.muted{color:#666}
        .message{padding:12px;background:#e7f6e7;border:1px solid #b8dfb8;margin-bottom:15px}
        .total{font-size:22px;font-weight:bold;text-align:right}
    </style>
</head>
<body>
<nav>
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'food_list' %}">Food</a>
    <a href="{% url 'category_list' %}">Categories</a>
    <a href="{% url 'customer_list' %}">Customers</a>
    <a href="{% url 'order_list' %}">Orders</a>
    <a href="{% url 'order_create' %}">New Order</a>
    <a href="/admin/">Admin</a>
</nav>
<div class="container">
    {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
